# 📦 ДАТАСЕТ (результат этапа разметки)
dataset:
  name: "video5_v1"                 # Имя папки датасета внутри datasets/
  source_frames_dir: "../source/video_5" # Откуда брать кадры для копирования
  base_dir: "datasets"              # Корень для всех датасетов

# 1 (179) 25 x 7
# 2 (780) 25 x 30
# 4 (677) 25 x 25
# 5 (468) 25 x 17

# 🤖 МОДЕЛЬ
model:
  path: "rtdetr-l.pt"
  conf_threshold: 0.001
  imgsz: 640
  device: "cpu"                     # "0" для GPU
# cpu

# 📝 РАЗМЕТКА
annotation:
  classes: ["car", "truck", "bus"]
  model_conf: 0.4
  num_images: 25
  step: 17
  min_box_size: 9

inference:
  distortions:
    # 🔹 Базовая линия (clean)
    - id: "clean"
      type: "none"
      levels: [{}]

    # 🔹 Гауссовский шум (σ в пикселях, 0–255)
    - id: "gaussian_noise"
      type: "gaussian_noise"
      levels:
        - {sigma: 3}    # Уровень 1: почти незаметен
        - {sigma: 7}    # Уровень 2: лёгкая зернистость
        - {sigma: 12}   # Уровень 3: заметный шум
        - {sigma: 18}   # Уровень 4: умеренный
        - {sigma: 25}   # Уровень 5: сильный
        - {sigma: 35}   # Уровень 6: очень сильный (критическая зона)
        - {sigma: 50}   # Уровень 7: критический
        - {sigma: 70}   # Уровень 8: экстремальный
        - {sigma: 90}   # Уровень 9: почти нечитаемо
        - {sigma: 110}  # Уровень 10: полный деструктив

    # 🔹 JPEG-сжатие (Q: качество, 1–100, чем ниже — тем хуже)
    - id: "jpeg_compress"
      type: "jpeg_compress"
      levels:
        - {quality: 95}  # Уровень 1: эталон
        - {quality: 80}  # Уровень 2: почти незаметно
        - {quality: 60}  # Уровень 3: лёгкие артефакты
        - {quality: 40}  # Уровень 4: заметные блоки
        - {quality: 25}  # Уровень 5: явные артефакты
        - {quality: 15}  # Уровень 6: сильные блоки
        - {quality: 10}  # Уровень 7: детали теряются
        - {quality: 7}   # Уровень 8: экстремальные блоки
        - {quality: 4}   # Уровень 9: почти нечитаемо
        - {quality: 2}   # Уровень 10: полный деструктив

    # 🔹 Гауссовское размытие (σ ядра + автоматический подбор ksize)
    - id: "gaussian_blur"
      type: "gaussian_blur"
      levels:
        - {sigma: 0.5, ksize: 3}   # Уровень 1: едва заметно
        - {sigma: 1.0, ksize: 3}   # Уровень 2: лёгкое смягчение
        - {sigma: 1.5, ksize: 5}   # Уровень 3: заметное
        - {sigma: 2.5, ksize: 7}   # Уровень 4: умеренное
        - {sigma: 3.5, ksize: 9}   # Уровень 5: сильное
        - {sigma: 5.0, ksize: 13}  # Уровень 6: очень сильное
        - {sigma: 7.0, ksize: 17}  # Уровень 7: контуры теряются
        - {sigma: 10.0, ksize: 23} # Уровень 8: экстремальное
        - {sigma: 14.0, ksize: 31} # Уровень 9: почти нечитаемо
        - {sigma: 20.0, ksize: 43} # Уровень 10: полный деструктив

    # 🔹 Яркость (α=1.0 фикс, β варьируется, диапазон -80..+100)
    - id: "brightness"
      type: "brightness_contrast"
      levels:
        - {alpha: 1.0, beta: -80}  # Уровень 1: сильное затемнение
        - {alpha: 1.0, beta: -60}  # Уровень 2: умеренное
        - {alpha: 1.0, beta: -40}  # Уровень 3: лёгкое
        - {alpha: 1.0, beta: -20}  # Уровень 4: едва заметно
        - {alpha: 1.0, beta: 0}    # Уровень 5: baseline (чистый)
        - {alpha: 1.0, beta: 20}   # Уровень 6: едва заметно
        - {alpha: 1.0, beta: 40}   # Уровень 7: лёгкое осветление
        - {alpha: 1.0, beta: 60}   # Уровень 8: умеренное
        - {alpha: 1.0, beta: 80}   # Уровень 9: сильное
        - {alpha: 1.0, beta: 100}  # Уровень 10: экстремальный пересвет

    # 🔹 Контраст (β=0 фикс, α варьируется, диапазон 0.1..5.0)
    - id: "contrast"
      type: "brightness_contrast"
      levels:
        - {alpha: 0.1, beta: 0}  # Уровень 1: почти серый
        - {alpha: 0.2, beta: 0}  # Уровень 2: очень низкий
        - {alpha: 0.4, beta: 0}  # Уровень 3: низкий
        - {alpha: 0.6, beta: 0}  # Уровень 4: слегка пониженный
        - {alpha: 1.0, beta: 0}  # Уровень 5: baseline (чистый)
        - {alpha: 1.5, beta: 0}  # Уровень 6: повышенный
        - {alpha: 2.0, beta: 0}  # Уровень 7: высокий
        - {alpha: 2.5, beta: 0}  # Уровень 8: очень высокий
        - {alpha: 3.5, beta: 0}  # Уровень 9: пересвет деталей
        - {alpha: 5.0, beta: 0}  # Уровень 10: экстремальный

  visuals_per_level: 3  # Сколько кадров сохранять для визуального отчёта

metrics:
  iou_threshold: 0.5          # Порог IoU для TP/FP (стандарт COCO/Pascal VOC)
  target_classes: ["car", "truck", "bus"]  # Классы для оценки
  confidence_threshold: 0.001 # Порог уверенности модели (оставляем низким, фильтрация по IoU)

experiment:
  name: "exp_merged_4videos"
  base_dir: "experiments"
  # 👇 Список папок из datasets/, которые объединятся в один эксперимент
  datasets_to_merge:
    - "video1_v1"
    - "video2_v1"
    - "video4_v1"
    - "video5_v1"